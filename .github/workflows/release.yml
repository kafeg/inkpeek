name: Release
# A tag "v1.2.3" builds a signed APK from that commit and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
      - name: Name and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "inkpeek-${GITHUB_REF_NAME}.apk"
          sha256sum "inkpeek-${GITHUB_REF_NAME}.apk" > "inkpeek-${GITHUB_REF_NAME}.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            inkpeek-*.apk
            inkpeek-*.apk.sha256
          generate_release_notes: true
