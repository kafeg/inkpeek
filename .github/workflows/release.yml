name: Release
# The title names the tag for a push and for a run by hand: scripts/release.sh finds its run by it.
run-name: Release ${{ inputs.tag || github.ref_name }}
# A tag "v<appVersion>.<commits>" (the version the build computes) builds a signed APK from that commit and attaches
# it to a GitHub release; the notes are the commit subjects since the previous tag (the app's update shows them),
# CHANGELOG.md's section of the version stays the summary per minor version.
# Normally run through scripts/release.sh.
on:
  push:
    tags: ['v*']
  # By hand when a tag's push event is lost (GitHub webhooks degraded): gh workflow run release.yml -f tag=v0.5.N
  workflow_dispatch:
    inputs:
      tag: { description: "Tag to release, e.g. v0.5.112", required: true }
permissions:
  contents: write
concurrency: { group: "release-${{ inputs.tag || github.ref_name }}", cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0, ref: "${{ inputs.tag || github.ref }}" }   # all commits: their count is the version
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }   # main's cache; a tag build adds none
      - name: Signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: The tag names the built version
        run: test "v$(sed -n 's/^appVersion=//p' gradle.properties).$(git rev-list --count HEAD)" = "$TAG"
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Name and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "inkpeek-${TAG}.apk"
          sha256sum "inkpeek-${TAG}.apk" > "inkpeek-${TAG}.apk.sha256"
      - name: Notes of this build
        run: |
          V=$(sed -n 's/^appVersion=//p' gradle.properties)
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"; echo
              git log --no-merges --format='- %s' "$PREV..$TAG" | grep -v -E '^- (CHANGELOG|CI|Docs?)\b' || true
              echo
              echo "Everything in $V: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            else
              awk -v v="## $V" 'index($0, v) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md
            fi
          } > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            inkpeek-*.apk
            inkpeek-*.apk.sha256
          tag_name: ${{ env.TAG }}
          body_path: notes.md
