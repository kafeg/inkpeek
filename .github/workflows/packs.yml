name: Packs
# Builds the packs of the given languages only and adds them to release "packs" (packs.json is merged).
# kaikki dumps are cut into per-language slices once and kept in release "packs-sources"; a dump is downloaded
# again only when kaikki changed it.
on:
  workflow_dispatch:
    inputs:
      langs: { description: "Book languages", default: "de,en" }
      answers: { description: "Answer languages", default: "ru,en" }
      publish: { description: "Upload to release 'packs'", type: boolean, default: true }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: /tmp/packs-work
      # Inputs through the environment, not pasted into the scripts.
      LANGS: ${{ inputs.langs }}
      ANSWERS: ${{ inputs.answers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s packs/tests
      - run: python3 packs/build.py slices --langs "$LANGS" --answers "$ANSWERS" --work "$WORK"
      - run: python3 packs/build.py all --langs "$LANGS" --answers "$ANSWERS" --work "$WORK" --out packs-out
      - run: PACKS_OUT=packs-out python3 -m unittest discover -s packs/tests
      - if: ${{ inputs.publish }}
        run: python3 packs/build.py publish --work "$WORK" --out packs-out --release packs
      # A dry run keeps its packs even when golden words fail: they are what gets measured.
      - if: ${{ always() && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with: { name: packs-out, path: "packs-out/*.*" }
